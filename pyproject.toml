[project]
name = "compsr"
version = "1.0.0"
description = "CNN restoration of AV1-compressed, Lanczos-upscaled DIV2K luma"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuvam Mukherjee" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "PyYAML>=6",
  "matplotlib>=3.8",
  "pillow>=10",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
compsr = "compsr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["compsr*"]

[tool.setuptools.package-data]
compsr = ["checksums.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: optional ffmpeg/libaom integration"]
